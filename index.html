<!DOCTYPE html>
<html lang="en" ng-app="thortfulApp">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>thortful · GitHub Explorer</title>
  <meta name="description" content="Search GitHub repositories, browse issues and visualise the numbers. Built for the Thortful Front End Challenge.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Sunday+Best&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <header class="hero">
    <div class="container">
      <p class="hero-kicker"><i class="bi bi-github"></i> Thortful Front End Challenge</p>
      <h1 class="hero-title">thortful<span class="hero-dot">.</span> <span class="hero-subtitle">GitHub Explorer</span></h1>
      <p class="hero-lead">Search any repository, read its issues and see the numbers at a glance.</p>
      <search-bar></search-bar>
    </div>
  </header>

  <main class="container content" ng-cloak>
    <div class="row g-4">
      <div class="col-lg-6">
        <repo-results></repo-results>
      </div>
      <div class="col-lg-6">
        <repo-detail></repo-detail>
      </div>
    </div>

    <issues-panel class="d-block"></issues-panel>
  </main>

  <footer class="site-footer">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <span><i class="bi bi-heart-fill text-brand"></i> Made for <a href="https://www.thortful.com" target="_blank" rel="noopener">thortful.com</a></span>
      <span class="footer-tech">AngularJS · Bootstrap 5 · Chart.js · GitHub API</span>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/app.js"></script>
  <script src="js/services/github.service.js"></script>
  <script src="js/services/search.service.js"></script>
  <script src="js/services/selection.service.js"></script>
  <script src="js/filters/strip-tags.filter.js"></script>
  <script src="js/filters/compact-number.filter.js"></script>
  <script src="js/components/search-bar/search-bar.component.js"></script>
  <script src="js/components/repo-card/repo-card.component.js"></script>
  <script src="js/components/repo-results/repo-results.component.js"></script>
  <script src="js/components/repo-detail/repo-detail.component.js"></script>
  <script src="js/components/issues-panel/issues-panel.component.js"></script>
</body>
</html>
